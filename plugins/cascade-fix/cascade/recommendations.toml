# 기기 환경별 프로필 추천 표. `CF setup`이 읽는다.
# - status = "measured"는 코드 모드 작업자 칸(code.a·code.b·code.adjudicator) 기준이다. 문서 모드·검토 칸은 재지 않았다.
# - 표의 모든 프로필 이름은 내장 프로필이어야 한다. 사용자 정의 이름은 기기마다 달라 표에 넣을 수 없다.
#
# 갱신 절차
# - 측정 결과로 표를 바꾸는 일은 측정 계획 5절의 「내장값을 바꾸는 변경」과 같은 PR에서 한다.
# - 그 PR은 환경마다 그 환경에서 돌 수 있는 후보만 넣어 `eval/select_profiles.py --json`을 따로 부른다.
#   지금 측정 후보로 보면 다음과 같다.
#     none          m-claude-only
#     codex         m-claude-only, m-mix-codex-haiku
#     cursor        m-claude-only, m-mix-sonnet-cursor
#     codex+cursor  넷 모두
# - 선정은 켬 값(adopt_on_both_pass = true) 쪽 결과를 쓴다. 내장 claude-only·local이 켬이기 때문이다.
# - 「같은 칸 값」은 측정한 코드 모드 칸(code.a·code.b·code.adjudicator)이 같다는 뜻이다. 문서 모드 칸과
#   검토 칸은 측정 1·2단계가 재지 않으므로 비교하지 않는다. 3단계(문서 모드·첫 검토) 결과가 나오면 같은 방식으로 늘린다.
# - 환경마다 `selected`가 나오면, 그 후보와 같은 칸 값을 가진 내장 프로필 이름을 recommend에 적고
#   status = "measured", source에 결과 문서 경로를 적는다. 그런 내장 프로필이 없으면 그 PR에서 새 내장 프로필을
#   만든다(이름은 그 PR에서 정한다). `selected`가 없으면 그 환경은 claude-only·provisional로 둔다.
# - 표를 바꾸면 version을 1 올린다. 플러그인 버전과는 따로 센다. 플러그인 업데이트 중 표가 바뀐 경우만 알리기 위해서다.
# - 측정 세션의 결과 문서 형식이 정해지면 위 대응이 맞는지 맞춰 본다.
version = 1
updated = "2026-10-23"
source = ""

[env.none]
recommend = "claude-only"
status = "measured"
alternatives = []

[env.codex]
recommend = "claude-only"
status = "provisional"
alternatives = [{ profile = "local", status = "provisional", note = "측정 전 잠정값" }]

[env.cursor]
recommend = "claude-only"
status = "provisional"
alternatives = []

[env."codex+cursor"]
recommend = "claude-only"
status = "provisional"
alternatives = [{ profile = "local", status = "provisional", note = "측정 전 잠정값" }]
