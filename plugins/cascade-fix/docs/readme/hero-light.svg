<rect x="240" y="252" width="172" height="64" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/><text x="258" y="280.0" font-size="16" font-weight="700" fill="#18181B">작업자 B</text><text x="258" y="301.0" font-size="12.5" fill="#71717A">Haiku 5.5 · 워크트리 2</text>
