<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">cascade-fix — 리뷰 지적을 작업자 둘이 고치고, 갈린 것만 Opus가 판가름하는 Claude Code 플러그인</title>
<desc id="d">리뷰 지적 하나를 작업자 A(Sonnet)와 B(Haiku)가 각자 워크트리에서 고치고, 테스트 등 기계 검증과 합의가 맞으면 채택해 작업 트리에 적용하며, 갈린 것만 Opus가 판가름하고, 그래도 못 정한 것은 사람이 고를 목록으로 넘기는 흐름</desc>
