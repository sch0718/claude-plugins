<text x="108" y="88" font-size="13" fill="#A4A8B0">Claude Code 플러그인</text>
<text x="40" y="132" font-size="17" font-weight="700" fill="#A4A8B0">지적 하나씩, 싼 모델 둘이 고치고 검증으로 채택</text>
