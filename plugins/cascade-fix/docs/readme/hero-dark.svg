<rect x="240" y="252" width="172" height="64" rx="14" fill="#17191D" stroke="#2A2D33" stroke-width="1.5"/><text x="258" y="280.0" font-size="16" font-weight="700" fill="#F2F3F5">작업자 B</text><text x="258" y="301.0" font-size="12.5" fill="#A4A8B0">Haiku 5.5 · 워크트리 2</text>
