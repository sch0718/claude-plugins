# 저장소별 검증 명령 설정. 키는 [repos."<저장소 루트 절대 경로>"] 형식이다.
# 이 파일은 형식 견본이다. 실제 설정은 ~/.claude/cascade-fix/repos.toml 에 적는다(플러그인 업데이트에도 남는다).
# 예전처럼 이 파일에 항목을 적어도 읽지만, ~/.claude/cascade-fix/repos.toml 이 있으면 그쪽이 우선한다.
# CASCADE_REPOS_TOML 환경 변수로 다른 파일을 지정할 수 있다.
# 명령에 쓸 수 있는 자리표시자: {files}(tests는 관련 테스트 파일 목록, format은 작업자가 바꾼 파일 목록),
# {file}(검사할 단일 파일), {root}(setup에서 원래 저장소 루트)
# 값은 모두 문자열 목록이다(tests = "pytest"처럼 문자열 하나를 쓰면 init이 종료 코드 5로 멈춘다).
# 워크트리는 저장소 안 .cascade-fix/ 에 생긴다. jest·vitest·eslint는 .cascade-fix 를 제외 설정에 넣는다.
#
# [repos."/Users/me/work/example-repo"]
# setup = ["ln -s {root}/node_modules node_modules"]  # 워크트리마다 한 번 돌리는 명령(만든 파일은 .gitignore 대상이어야 한다)
# tests = ["pytest {files}"]               # 변경과 관련된 테스트만 돌리는 명령(관련 테스트가 없으면 full_tests로 대신 돈다)
# full_tests = ["pytest"]                  # 전체 테스트 명령
# build = ["npm run build"]                # 빌드 명령
# typecheck = ["mypy ."]                   # 타입 검사 명령
# lint = ["ruff check ."]                  # 린트 명령
# format = ["ruff format {files}"]         # 포맷 명령. 바꾼 파일에만 돈다({files}가 없으면 파일을 뒤에 붙인다)
# sensitive_paths = ["**/auth*", "**/security*", "**/*delete*", "**/migrations/**"]  # 보안·인증·데이터 삭제 경로(glob, 대소문자 무시)
#
# [repos."/Users/me/work/example-repo".doc_snippet_check]
# python = "python -m py_compile {file}"   # 문서 속 코드 조각 검사 명령(언어별)
#
# 역할 프로필: 역할 14칸(<모드>.<역할>)마다 runner·모델·effort·대체 실행 대상(fallback)을 묶어 고른다.
# 내장 프로필은 default(옛 동작 그대로)·claude-only(Claude만)·local(Codex·Cursor 활용, 측정 전 잠정값) 셋이다.
# 고르는 순서: init·detect·review의 --profile > CASCADE_PROFILE > 저장소 항목의 profile > 최상위 default_profile > 내장 default.
# 칸 키: code.review code.a code.b code.adjudicator code.opinion code.recheck
#        doc.review doc.judge_a doc.judge_b doc.writer doc.checker doc.adjudicator doc.opinion doc.recheck
# 칸 값: runner(claude·codex·cursor, 검토 칸은 auto도), model, effort, fallback. 판가름 칸은 claude만 받는다.
# 칸 키에는 점이 있어 따옴표로 감싼다. 인라인 표는 한 줄에 적는다(TOML은 여러 줄 인라인 표를 받지 않는다).
# 내장 이름과 같은 [profiles.<이름>]은 그 프로필을 칸 단위로 덮고(base는 쓸 수 없다), 새 이름은 base로 시작점을 고른다(없으면 default).
# claude-only는 덮을 수 없다. [profiles.claude-only]를 적으면 init이 종료 코드 5로 멈춘다. 바꾸려면 base = "claude-only"로 새 이름을 만든다.
#
# default_profile = "local"                                  # 최상위(첫 표보다 앞에 적는다). 저장소 항목에 profile이 없을 때 쓴다
#
# [profiles.local]                                           # 내장 local을 칸 단위로 덮는다. 적지 않은 칸은 내장값이다
# adopt_on_both_pass = true
# "code.a" = { runner = "codex", effort = "low" }
# "code.b" = { runner = "claude", model = "claude-haiku-5-5", effort = "low" }
#
# [repos."/Users/me/work/regulations"]
# profile = "claude-only"                                    # 사내규정 원문이 든 저장소는 Claude만
# tests = ["pytest {files}"]
#
# 아래 두 표는 새 이름의 예시다. 고르기 전에는 쓰이지 않는다(--profile mix-sonnet-cursor).

[profiles.mix-sonnet-cursor]
base = "claude-only"
"code.b" = { runner = "cursor", model = "composer-2.5" }

[profiles.codex-a-cursor-fallback]
base = "claude-only"
"code.a" = { runner = "codex", fallback = { runner = "cursor", model = "composer-2.5" } }

[repos]
