<title id="t">doclookup — 문서 질문에 파일:줄로 답하는 Claude Code 플러그인</title>
<desc id="d">문서 질문이 기기의 저장소별 설정(&lt;이름&gt;.toml)을 거쳐 마크다운은 제목 단위 절로 색인하고 지정한 텍스트는 줄 단위로 찾아, search·impact·refs·links로 쓰인 곳과 바꾸면 같이 고칠 곳, 가리키는 곳과 깨진 링크를 확인하는 흐름</desc>
