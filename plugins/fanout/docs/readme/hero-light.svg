<title id="t">fanout — 고칠 것들을 하위 세션에 나눠 PR 병합까지 맡기는 Claude Code 플러그인</title>
<desc id="d">대화에서 정리한 고칠 것 목록을 겹치지 않게 묶어, 세션마다 별도 워크트리에서 설계 검토, 구현, 검토, 수정, PR 병합까지 끝내게 하고, 메인 세션이 통합 검증과 정리를 하는 흐름</desc>
